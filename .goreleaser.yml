project_name: fury-cli
version: 2

# Reproducible builds: no build paths, no build-time timestamps, and the
# module as served by the Go module proxy (tagged releases only).
gomod:
  proxy: true

builds:
  - binary: fury
    main: ./cmd/fury
    flags: [-trimpath]
    ldflags: -s -w -X main.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

universal_binaries:
  - name_template: fury
    replace: true
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{- .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{- title .Os }}{{ end }}_
      {{- if eq .Arch "all" }}universal
      {{- else if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}ARM64
      {{- else }}{{ .Arch }}{{ end }}

changelog:
  disable: true

release:
  draft: false
  # A tag with a suffix, as v1.1.0-beta.1, is a pre-release and never "latest".
  prerelease: auto

nfpms:
  - id: nfpm-default
    vendor: Gemfury.com
    homepage: &homepage https://gemfury.com/
    maintainer: &maintainer Gemfury Team <team@gemfury.com>
    description: &description CLI for the Gemfury package repository
    license: Proprietary

    # Every format here is pushed to the Gemfury `cli` repository by the
    # publisher below: deb for apt, apk for Alpine, archlinux for pacman.
    formats: [deb, apk, archlinux]
    mtime: "{{ .CommitDate }}"

    # Written to .PKGINFO; without it nfpm writes "Unknown Packager".
    archlinux:
      packager: *maintainer

publishers:
  - name: gemfury-repo
    # A rejected upload fails the release instead of passing silently.
    cmd: curl -sS --fail-with-body -F p1=@{{ .ArtifactPath }} https://{{ .Env.FURY_PUSH_TOKEN }}@push.fury.io/cli/
    ids: [nfpm-default]

homebrew_casks:
  # Defaults to the cask name (fury-cli); the archive ships `fury`.
  - binaries: [fury]

    repository:
      owner: gemfury
      name: homebrew-tap
      token: "{{ .Env.BREW_TAP_GITHUB_TOKEN }}"

    commit_author:
      email: goreleaser@gemfury.com
      name: goreleaser

    homepage: *homepage
    description: *description

    # A cask cannot declare a conflict with a formula, so warn about the
    # Ruby "gemfury" formula here instead.
    caveats: |
      This cask installs the "fury" binary and cannot coexist with the
      legacy Ruby "gemfury" formula. Uninstall it first if present.

    # Homebrew quarantines cask downloads, and Gatekeeper blocks unsigned
    # quarantined binaries, so clear the bit on macOS. Homebrew 7 deprecated
    # the `postflight` stanza that `hooks.post.install` emits, in favour of
    # `postflight_steps`, which GoReleaser cannot write yet (goreleaser#6870),
    # hence the custom block. `{{staged_path}}` is a Homebrew token, quoted so
    # that GoReleaser's own templating leaves it in place.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-d", "com.apple.quarantine", "{{ "{{staged_path}}" }}/fury"], must_succeed: false
        end
      end
