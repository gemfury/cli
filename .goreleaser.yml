project_name: fury-cli
version: 2

builds:
  - binary: fury
    main: ./cmd/fury
    ldflags: -s -w -X main.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

universal_binaries:
  - name_template: fury
    replace: true

archives:
  - formats: [tar.gz]
    wrap_in_directory: false
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{- .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{- title .Os }}{{ end }}_
      {{- if eq .Arch "all" }}universal
      {{- else if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}ARM64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end -}}

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

changelog:
  disable: true

release:
  draft: false

nfpms:
  - id: nfpm-default
    package_name: fury-cli

    vendor: Gemfury.com
    homepage: https://gemfury.com/
    maintainer: Gemfury Team <team@gemfury.com>
    description: CLI for the Gemfury package repository
    license: Proprietary

    formats:
      - deb

    bindir: /usr/bin

publishers:
  - name: gemfury-repo
    dir: "{{ dir .ArtifactPath }}"
    cmd: curl -s -F p1=@{{ .ArtifactName }} https://{{ .Env.FURY_PUSH_TOKEN }}@push.fury.io/cli/
    ids:
      - nfpm-default

brews:
  -
    # Name template of the recipe
    name: fury-cli

    # GitHub repository to receive formula
    repository:
      owner: gemfury
      name: homebrew-tap
      token: "{{ .Env.BREW_TAP_GITHUB_TOKEN }}"

    # Git author used to commit to the repository.
    commit_author:
      email: goreleaser@gemfury.com
      name: goreleaser

    # Folder inside the repository to put the formula.
    directory: Formula

    # App's homepage.
    homepage: "https://gemfury.com/"

    # App's description.
    description: "CLI for the Gemfury package repository"

    # Conflicts with Ruby CLI
    conflicts:
      - gemfury

    # Transition notice; retire it together with this block.
    caveats: |
      The fury-cli formula will be replaced by a cask in an upcoming release.
      To switch early: brew uninstall fury-cli && brew install --cask gemfury/tap/fury-cli

    # Run to `brew test` the formula.
    test: |
      system "#{bin}/fury --version"

# Replaces the deprecated `brews` formula above; both publish to the same
# tap until the formula is retired.
homebrew_casks:
  - name: fury-cli

    # Defaults to the cask name (fury-cli); the archive ships `fury`.
    binaries:
      - fury

    repository:
      owner: gemfury
      name: homebrew-tap
      token: "{{ .Env.BREW_TAP_GITHUB_TOKEN }}"

    commit_author:
      email: goreleaser@gemfury.com
      name: goreleaser

    directory: Casks

    homepage: "https://gemfury.com/"
    description: "CLI for the Gemfury package repository"

    # A cask cannot declare a conflict with a formula, so warn about the
    # Ruby "gemfury" formula here instead.
    caveats: |
      This cask installs the "fury" binary and cannot coexist with the
      legacy Ruby "gemfury" formula. Uninstall it first if present.

    # Homebrew quarantines cask downloads and Gatekeeper blocks unsigned
    # quarantined binaries, so clear the bit. Linux casks need no such step.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-d", "com.apple.quarantine", "#{staged_path}/fury"]
          end
